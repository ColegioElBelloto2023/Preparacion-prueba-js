<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <input type="text" name="buscar" id="buscar">
        <button onclick="buscarPalabra()">Buscar</button>
    </div>

    <div class="container">
        <div class="card">
            <div>
                <img src="img/black.png" alt="ninja negro">
            </div>
            <div class="me-gusta">
                <button onclick="aumentarMegusta('contador-negro')">Me gusta</button>
                <p id="contador-negro">0</p>
            </div>
        </div>
        <div class="card">
            <div>
                <img src="img/blue.png" alt="ninja azul">
            </div>
            <div class="me-gusta">
                <button onclick="aumentarMegusta('contador-azul')">Me gusta</button>
                <p id="contador-azul">0</p>
            </div>
        </div>
        <div class="card">
            <div>
                <img src="img/green.png" alt="ninja verde">
            </div>
            <div class="me-gusta">
                <button onclick="aumentarMegusta('contador-verde')">Me gusta</button>
                <p id="contador-verde">0</p>
            </div>
        </div>
        <div class="card">
            <div>
                <img src="img/red.png" alt="ninja rojo">
            </div>
            <div class="me-gusta">
                <button onclick="aumentarMegusta('contador-rojo')">Me gusta</button>
                <p id="contador-rojo">0</p>
            </div>
        </div>
    </div>

    <div class="card">
        <img id="imagen" src="img/black.png" alt="ninja negro">
        <button onclick="cambiarImagen()">Cambiar imagen</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
